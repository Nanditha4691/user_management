<!DOCTYPE html>
<html>
<head>
    <title>Search User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 text-center">

    <div class="card p-4 shadow">
        <h3 class="text-warning mb-3">Search User</h3>

        <input type="number" id="userId" class="form-control mb-3" placeholder="Enter User ID">

        <button class="btn btn-warning" onclick="searchUser()">Search</button>

        <div id="result" class="mt-4"></div>
    </div>

</div>

<script>
const BASE_URL = "http://localhost:8080";

function searchUser() {
    let id = document.getElementById("userId").value;

    fetch(BASE_URL + "/searchUser/" + id)
    .then(res => res.json())
    .then(u => {
        document.getElementById("result").innerHTML = `
            <div class="alert alert-success">
                <h5>${u.username}</h5>
                <p>${u.email}</p>
                <p>${u.mobile}</p>
            </div>`;
    })
    .catch(() => alert("User not found"));
}
</script>

</body>
</html>
