<!DOCTYPE html>
<html>
<head>
    <title>Register User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center text-primary mb-3">Register User</h3>

        <div class="row">
            <div class="col-md-6">
                <input class="form-control mb-2" id="username" placeholder="Username">
                <input class="form-control mb-2" id="email" placeholder="Email">
                <input type="password" class="form-control mb-2" id="password" placeholder="Password">
                <input class="form-control mb-2" id="mobile" placeholder="Mobile">
            </div>

            <div class="col-md-6">
                <input type="date" class="form-control mb-2" id="dob">
                <select class="form-control mb-2" id="gender">
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHERS">Others</option>
                </select>
                <input class="form-control mb-2" id="address" placeholder="Address">
                <input class="form-control mb-2" id="dpUrl" placeholder="Profile URL">
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-3" onclick="registerUser()">Register</button>
    </div>
</div>

<script>
const BASE_URL = "http://localhost:8080";

function registerUser() {
    const user = {
        username: username.value,
        email: email.value,
        password: password.value,
        mobile: mobile.value,
        dob: dob.value,
        gender: gender.value,
        address: address.value,
        dpUrl: dpUrl.value
    };

    fetch(BASE_URL + "/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(user)
    })
    .then(res => res.text())
    .then(msg => alert(msg));
}
</script>

</body>
</html>
